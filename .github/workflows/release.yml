name: Release

# Pushing a tag such as v0.1.0-beta.1 builds every target and attaches the jars to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target:
          - 1.20.1-fabric
          - 1.20.1-forge
          - 1.21.1-fabric
          - 1.21.1-forge
          - 1.21.1-neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build ${{ matrix.target }}
        run: ./gradlew :${{ matrix.target }}:build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bloomberto-${{ matrix.target }}
          path: |
            versions/${{ matrix.target }}/build/libs/bloomberto-*.jar
            !versions/${{ matrix.target }}/build/libs/*-sources.jar
            !versions/${{ matrix.target }}/build/libs/*-dev.jar
            !versions/${{ matrix.target }}/build/libs/*-testmod*.jar

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true
      - name: List jars
        run: ls -l jars
      - uses: softprops/action-gh-release@v2
        with:
          files: jars/*.jar
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
