name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - 1.20.1-fabric
          - 1.20.1-forge
          - 1.21.1-fabric
          - 1.21.1-forge
          - 1.21.1-neoforge
          - 1.21.11-fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build ${{ matrix.target }}
        run: ./gradlew :${{ matrix.target }}:build --no-daemon  # build includes the JUnit tests
      - uses: actions/upload-artifact@v4
        with:
          name: bloomberto-${{ matrix.target }}
          path: |
            versions/${{ matrix.target }}/build/libs/*.jar
            !versions/${{ matrix.target }}/build/libs/*-sources.jar
            !versions/${{ matrix.target }}/build/libs/*-dev.jar

  selftest-server:
    # Starts a dedicated server and runs the testmod's in-game self-test (Forge 1.21.1 is left out: Loom's runServer fails for it).
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target:
          - 1.20.1-fabric
          - 1.20.1-forge
          - 1.21.1-fabric
          - 1.21.1-neoforge
          - 1.21.11-fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Self-test ${{ matrix.target }} (server)
        run: scripts/selftest.sh server ${{ matrix.target }}

  selftest-client:
    # Runs the client self-test in a singleplayer world on a virtual screen with software OpenGL.
    runs-on: ubuntu-latest
    needs: selftest-server
    strategy:
      fail-fast: false
      matrix:
        target:
          - 1.20.1-fabric
          - 1.20.1-forge
          - 1.21.1-fabric
          - 1.21.1-neoforge
          - 1.21.11-fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install a virtual screen and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: Self-test ${{ matrix.target }} (client)
        run: scripts/selftest.sh client ${{ matrix.target }}
