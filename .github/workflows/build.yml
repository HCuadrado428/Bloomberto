name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - 1.20.1-fabric
          - 1.20.1-forge
          - 1.21.1-fabric
          - 1.21.1-forge
          - 1.21.1-neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build ${{ matrix.target }}
        run: ./gradlew :${{ matrix.target }}:build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bloomberto-${{ matrix.target }}
          path: |
            versions/${{ matrix.target }}/build/libs/*.jar
            !versions/${{ matrix.target }}/build/libs/*-sources.jar
